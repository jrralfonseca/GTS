# ═══════════════════════════════════════════════════════════════════════════
# SUITES DE TESTS — el denominador de todo lo demas
# ═══════════════════════════════════════════════════════════════════════════
suites:

  - suite: bot
    comando: 'myenv\Scripts\python.exe -m pytest tests -p no:cacheprovider -q --no-header --basetemp FUERA_DEL_ARBOL'
    fecha: "2026-10-11"
    collected: 1463
    passed: 1384
    failed: 0
    skipped: 79
    exit_code: 0
    duracion: "9-10 min"
    conclusion: >
      VERDE, re-corrida tras el fix del reloj del broker (ISS-035): el
      detector de barras en formacion comparaba timestamps en hora del
      broker (EEST = UTC+3) contra el reloj local (UTC), clasificando
      toda barra reciente como "en formacion". Fix: `_reloj_del_broker()`
      en el adaptador usa `terminal.server_time()`. 3 tests nuevos
      (test_reloj_del_broker.py) con un doble cuyo reloj va 3h adelante.
      Cero fallos; los 79 saltos declaran su motivo (artefactos que la
      limpieza retiro).
    saltos:
      total: 79
      nota: >
        Cada skip declara su motivo en el propio test (mecanismo de ffbe39f).
        Los clusters grandes son los artefactos que la limpieza de la nueva
        etapa retiro: bundle gts/ (test_colab_bundle 28 + test_kaggle_layout 8)
        y barridos/checkpoints ausentes (test_sweep_universe, test_sweep_parallel,
        test_scaler_canonical 10, test_research_window 4).
    orden_adverso:
      comando: 'myenv\Scripts\python.exe -m pytest tests\test_kaggle_layout.py tests\test_sweep_parallel.py --basetemp FUERA_DEL_ARBOL'
      fecha: "2026-10-11"
      resultado: "exit 0 (kaggle_layout: 3 pasan, 8 saltan; sweep_parallel: 7 pasan, 4 saltan)"
      conclusion: "El orden que reprodujo los 3 fallos historicos (ISS-001) sale limpio: la contaminacion del arnes esta muerta."
    incidente_resuelto:
      titulo: "La suite se congelaba en coleccion: cache de numba envenenada"
      sintoma: >
        Tres corridas >60 min sin pasar del segundo modulo de test; un nucleo al
        100%; ningun basetemp creado; ningun resultado emitido.
      causa: >
        research/__pycache__/labeling._apply_triple_barrier_numba-93.py312.*.nbc
        y .nbi, escritos el 2026-10-10 20:50, congelaban la importacion de
        research.labeling. Demostracion: el mismo labeling.py copiado con cache
        virgen importa en 1.02 s; el original, bloqueo indefinido. El codigo esta
        sano. Ver ISS-030.
      fix: "Los 3 ficheros apartados a %TEMP%\\gts-numba-cache-backup (nada borrado). Cache regenerada verificada sana: un segundo proceso importa contra ella en 1.27 s."
      leccion: "Una suite que no avanza y quema un nucleo no es una suite lenta: es un import congelado. Mirar basetemp y el contador antes de esperar."

  - suite: panel
    comando: 'dashboard\.venv\Scripts\python.exe -m pytest dashboard\tests -p no:cacheprovider -q --no-header --basetemp FUERA_DEL_ARBOL'
    fecha: "2026-10-11"
    collected: 447
    passed: 447
    failed: 0
    skipped: 0
    exit_code: 0
    conclusion: >
      VERDE tras la reestructuracion del panel, R-012 (metricas con fuente y
      N + procedencia), R-013 (alertas Telegram, 17 tests con canal simulado
      y aviso real confirmado por el dueno) e ISS-034 (la puerta R:R fuera
      del panel: esquema sin ella, POST que la descarta con respuesta
      explicita). La suite del BOT se re-corrio tras ISS-034 (config.py es
      del bot): 1463/1384/79, exit 0.

  - suite: lint_y_tipos
    comando: "myenv\\Scripts\\python.exe -m ruff check . ; myenv\\Scripts\\python.exe -m mypy"
    estado: NO_EJECUTADO
    fecha: "2026-10-10"
    conclusion: "Definidos en pyproject.toml, sin CI que los ejecute (ISS-012). No medidos hoy."

  - suite: ci
    estado: INEXISTENTE
    evidencia: "Test-Path .github -> False"
    ver: ISS-012

