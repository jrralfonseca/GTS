        Lo que sigue VIVO no son los ficheros sino las consecuencias: la regla
        por defecto (EMA_Trend_Pullback) opero siempre sin evidencia (R-010) y
        el metodo del walk-forward sigue sin tramo fuera de muestra (ISS-002).
        Las cifras concretas ya no son reproducibles desde el arbol; si se
        necesitan, hay que re-emitirlas con el procedimiento nuevo.

  walkforward_modelo:
    estado: >
      RETIRADO DEL ARBOL por la limpieza de la nueva etapa (verificado
      2026-10-11: los ficheros ya no existen). Lo que queda abajo es el registro
      historico de la medicion del 2026-10-10; NO es evidencia reproducible
