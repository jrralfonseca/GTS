suites:

  - suite: bot_y_panel_completos
    comando: 'myenv\Scripts\python.exe -m scripts.suite_completa   (la puerta local: ambas suites, codigos de salida, basetemp fresco)'
    fecha: "2026-10-12"
    collected: 2148
    passed: 2094
    failed: 0
    skipped: 54
    exit_code: 0
    conclusion: >
      VERDE en ambas, certificacion de la etapa estructural: bot 1648
      coleccionados / 1594 pasan / 54 saltos con motivo / exit 0; panel
      500/500 / 0 saltos / exit 0. La corrida valida el arbol con los
      arreglos de la etapa: --resume sin off-by-one (ISS-036), lector
      round_trip (ISS-037), /api/learning honesto (ISS-028), lookback de
      la procedencia (ISS-038), conformidad de costes ejerciendo el motor
      (ISS-005), 11 guardianes revividos (ISS-006) y los cuatro lectores
      de precios enrutados por la puerta. Los 54 saltos (54, no 79 como
      el 2026-10-11: los guardianes revividos corren) declaran su motivo
      en el propio test; los clusters son el bundle gts/ retirado y los
      artefactos de la generacion anterior.
    incidente_resuelto:
      titulo: "El basetemp por defecto de pytest bloqueado enveneno una corrida entera"
      sintoma: >
        La primera corrida de la puerta local salio con 359+ errores de
        setup y exit 1 en ambas suites, sin un solo fallo de codigo.
      causa: >
        %TEMP%\pytest-of-fiver quedo con Access denied (WinError 5,
        os.scandir en la creacion del basetemp numerado). Ningun test
        llego a correr en los ficheros afectados.
      fix: "scripts/suite_completa.py pasa --basetemp a un tempfile.mkdtemp fresco por corrida."
      leccion: >
        Un rojo de setup masivo con cero FAILED es infraestructura, no
        codigo. El codigo de salida sigue siendo el veredicto, pero hay
        que mirar QUE fallo: solo-ERROR es la firma del entorno.

  - suite: bot
    comando: 'myenv\Scripts\python.exe -m pytest tests -p no:cacheprovider -q --no-header --basetemp FUERA_DEL_ARBOL'
    fecha: "2026-10-11"
    collected: 1463
    passed: 1384
    failed: 0
    skipped: 79
    exit_code: 0
    duracion: "9-10 min"
    conclusion: >
      VERDE, re-corrida tras el fix del reloj del broker (ISS-035). Entrada
      historica: superada por la corrida del 2026-10-12 (bot_y_panel_completos).
    saltos:
      total: 79
      nota: >
        Cada skip declara su motivo en el propio test (mecanismo de ffbe39f).
        El 2026-10-12 el recuento baja a 54: los guardianes de ISS-006
        corren ya, y el resto sigue declarando el suyo.

  - suite: panel
    comando: 'dashboard\.venv\Scripts\python.exe -m pytest dashboard\tests -p no:cacheprovider -q --no-header --basetemp FUERA_DEL_ARBOL'
    fecha: "2026-10-12"
    collected: 500
    passed: 500
    failed: 0
    skipped: 0
    exit_code: 0
    conclusion: >
      VERDE con los tests nuevos de la etapa: inferencia de lookback (3),
      learning sin boton (4). Cero saltos. Corrida via la puerta local.

  - suite: lint_y_tipos
    comando: "myenv\\Scripts\\python.exe -m ruff check . ; myenv\\Scripts\\python.exe -m mypy"
    estado: NO_EJECUTADO
    fecha: "2026-10-10"
    conclusion: "Definidos en pyproject.toml, sin puerta que los ejecute (ISS-012, PARCIAL). No medidos hoy."

  - suite: ci
    estado: INEXISTENTE_POR_FALTA_DE_REMOTE
