investigacion:

  limpieza_de_nueva_etapa:
    fecha: "2026-10-11 (verificado contra el arbol)"
    estado: >
      data/research/ esta VACIO. La limpieza de la nueva etapa (seccion 8 de la
      especificacion maestra) retiro barridos, confirmaciones, registro de
      experimentos y archivos de walk-forward que esta seccion documentaba en
      la revision anterior. Ninguna cifra de investigacion vive hoy en disco.
    arranque: >
      Verificado: el sistema no exige esa evidencia para arrancar. Los tests
      del bot que la usaban saltan con motivo declarado (79 saltos, ver
      suites[bot]); el panel tiene UN test fuera de esa convencion que falla
      duro (ISS-031).
    registro_historico_de_lo_retirado:
      barridos: "3 con Reality Check, todos NO significativos: AUDUSD H1 ATR_Breakout p=0.699; AUDUSD H1 EMA_Trend_Pullback p=0.998; AUDUSD H4 MA_Crossover p=0.272"
