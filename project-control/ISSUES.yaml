  - id: ISS-010
    titulo: "El walk-forward no reentrena por fold"
    severidad: alta
    confirma: si
    componente: [VAL-002]
    tipo: defecto_confirmado
    resumen: >
      _walkforward_validate desempaqueta train_idx y nunca lo usa: solo construye
      secuencias de test y predice. El checkpoint se carga UNA vez y se evalua sobre
      la serie entera. El modelo no se adapta a cada fold, que es lo que hace que la
      palabra walk-forward signifique algo.
    evidencia:
      - "research/backtest_v2.py:898 _walkforward_validate: train_idx se desempaqueta y no se usa (aparece en 2 lineas: la del desempaquetado y la del log)"
      - "scripts/walkforward_eval.py:156 el checkpoint se carga una vez"
      - "Medido: 112 de 148 folds caen dentro del tramo de entrenamiento"
    por_que_importa: >
      El bug walk-forward-not-retrained lleva abierto desde 2026-10-03. PARCIAL: lo
      que se hizo fue separar las dos poblaciones en el agregado y declarar
      headline: out_of_sample, no conseguir un walk-forward de verdad. Dejar de
      mezclar dos numeros no es lo mismo que tener un numero valido.
    pruebas_que_lo_fijan: "tests/test_walkforward.py verifica la ETIQUETA, no el reentrenamiento."
    fix_propuesto: "Barato: reportar solo los folds cuyo test empieza despues del corte. Caro: reentrenar por fold. El barato ya esta hecho; el caro es R-003."
    coste: "barato: hecho / caro: alto"
    reversibilidad: "revertir la particion"
    siguiente_accion: "Depende de ISS-002"

