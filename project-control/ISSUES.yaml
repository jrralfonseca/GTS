  - id: ISS-005
    titulo: "El test de conformidad de costes no ejerce ninguno de los dos motores"
    severidad: alta
    confirma: si
    componente: [BT-002]
    tipo: test_vacuo
    resumen: >
      tests/test_cost_conformity.py se presenta como el criterio de aceptacion de
      la conformidad entre el backtest y la simulacion. Su funcion _neto_backtest_usd()
      calcula el bruto A MANO y llama a trade_costs. Nunca construye
      PurgedWalkForwardBacktest, aunque lo importa en la linea 25. El unico motor que
      lo verifica es el de la simulacion.
    evidencia:
      - "tests/test_cost_conformity.py:25 importa PurgedWalkForwardBacktest"
      - "tests/test_cost_conformity.py:49-67 _neto_backtest_usd() -- no lo usa"
      - "tests/test_cost_conformity.py:68+ _neto_simulacion_usd() -- si construye SimulatedPortfolio"
      - "audit/PHASE1-REPORT.md H7 lo identifica como vacuo por construccion"
    por_que_importa: >
      El costeo unificado es el cambio mas grande de las ultimas dos semanas
      (git log c4ab485, e801d4e). La valla que lo sostiene no lo prueba.
    pruebas_que_lo_fijan: "test_el_mismo_trade_da_el_mismo_pnl_neto_en_ambos_motores -- pasa, pero comparando una cuenta manual contra el motor de simulacion."
    fix_propuesto: "Que _neto_backtest_usd() ejecute una operacion a traves de PurgedWalkForwardBacktest y compare su neto con el de la simulacion."
    coste: bajo
    reversibilidad: trivial
    estado: RESUELTO
    resuelto_por: >
      2026-10-12: `_neto_backtest_usd()` conduce
      `PurgedWalkForwardBacktest._compute_pnl` con un fold de 49 barras y
      EXACTAMENTE una senal (lunes 00:00 long, label mid-a-mid 1.1000->1.1100,
      hold 48, salida miercoles 00:00). El test exige un solo trade, con las
      barras de entrada y salida bien dichas, sin `clipped`, verifica que el
      bruto del motor es el retorno del label por el nocional, y compara el
