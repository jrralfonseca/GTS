      repetia la ultima epoca guardada. Cada reanudacion tiraba una epoca de
      presupuesto junto con su estado de optimizer/scheduler ya consumido.
      Documentado por tests/test_reanudacion_entrenamiento.py (9), que fijaban
      el comportamiento REAL a proposito, con el veredicto invertido para
      cuando se arreglara.
    evidencia:
      - "research/backtest_v2.py: start_epoch = state.get('epoch', 0) y range(start_epoch, ...)"
      - "Los dos tests del archivo decian literalmente: 'fija el comportamiento REAL, para que cuando se arreglie se vea que se ha arreglado'"
    fix_aplicado: >
      `start_epoch = completada + 1`, con `-1` de origen para que un
      checkpoint sin clave de epoca siga arrancando en la 0. Y el
      `best_epoch` inicial ya no es `start_epoch` - que tras el arreglo
      seria "la epoca que aun no ha corrido" - sino el mejor del propio
      checkpoint (model.best_epoch), porque si la sesion reanudada nunca
      mejora, el mejor de verdad sigue siendo el del checkpoint y el
      informe de cierre no puede decir otra cosa.
    verificado: >
      2026-10-12: los dos tests se invirtieron al comportamiento correcto
      (reanudar desde epoca 0 entrena 1,2; desde epoch_2 entrena 3 y no
      2); la reanudacion del horizonte pasado reporta el recuento real de
      epocas hechas; 9/9 del archivo en verde.
    coste: bajo
    reversibilidad: trivial
    estado: RESUELTO
    siguiente_accion: "ninguna"
    detectado_en: "2026-10-12, entrenamiento interrumpido a las 2/40 epocas (job entrenamiento-1p-40e)"

  - id: ISS-037
    titulo: "La puerta de lectura de CSVs perdia un ulp por valor al releer"
    severidad: alta
    confirma: si
    componente: [RES-002, QA-001]
    tipo: defecto_confirmado
    resumen: >
      `pd.read_csv` con el parser por defecto relee UN ULPIESMO por debajo
      de algunos doubles largos escritos con repr. Medido sobre el
      EURUSD_H1.csv recien descargado: 25.650 de ~500.000 valores cambiaban
      un ulp - la cadena `1.2794699999999999` volvia como `1.27947`, que es
      OTRO double - y con ellos el `data_hash` del fichero dejaba de
      cuadrar aunque el fichero fuera exactamente el descargado. El
      proyecto ya sabia que "el relector de siempre no es exactamente
      redondo -una ulp-" y lo esquivaba escribiendo %.17g en los pines; el
      lector principal seguia siendo no exacto.
    evidencia:
      - "test_puerta_de_csv.py::test_el_hash_declarado_corresponde_a_sus_velas[EURUSD_H1.csv] FALLO con el hash declarado d7b83d3e... y el calculado 11274bb4..."
      - "float_precision='round_trip' reproduce el hash declarado exactamente; 25.650 valores difieren entre ambos parseos"
      - "XAUUSD M15/M30: 0 valores difieren (el caso solo explota con reprs largos, tipicos de precios cercanos a 1.0)"
    fix_aplicado: >
      `research/io.read_frame` lee con `float_precision="round_trip"`. Por
      esa puerta pasan el hash, el replay y toda medicion: leer el precio
      exacto que fue escrito es lo que hace que dos corridas del mismo
      fichero sean la misma corrida. La valla nueva
