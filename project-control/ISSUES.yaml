      ninguna regla y el bot no envia ordenes. Con la valla nueva
      (test_la_configuracion_no_cita_ficheros_de_evidencia_inexistentes)
      ninguna cita a data/research/*.json puede volver a apuntar al aire:
      se comprueban TODAS las rutas citadas en config y README contra el
      disco, y el conteo minimo es parte de la asercion para que la valla
      no se quede sin nada que vigilar.
    verificado: "2026-10-12: test_shipped_signal_source 7/7; 0 rutas data/research/*.json citadas que no existan."
    siguiente_accion: "ninguna"

  - id: ISS-010
    titulo: "El walk-forward no reentrena por fold"
    severidad: alta
    confirma: si
    componente: [VAL-002]
    tipo: defecto_confirmado
    resumen: >
      _walkforward_validate desempaqueta train_idx y nunca lo usa: solo construye
      secuencias de test y predice. El checkpoint se carga UNA vez y se evalua sobre
      la serie entera. El modelo no se adapta a cada fold, que es lo que hace que la
      palabra walk-forward signifique algo.
    evidencia:
