    fix_propuesto: "Que _neto_backtest_usd() ejecute una operacion a traves de PurgedWalkForwardBacktest y compare su neto con el de la simulacion."
    coste: bajo
    reversibilidad: trivial
    siguiente_accion: "R-007"

