      Se cita en cinco sitios (gts.yaml:186, README:433, 442, 609, 642).
      Peor: la regla por defecto opera en EURUSD H1, y el unico barrido en disco de
      EMA_Trend_Pullback es de AUDUSD H1 con 0/25 y p=0.998. Ni el simbolo ni el
      timeframe coinciden con ninguna evidencia existente.
    evidencia:
      - "Test-Path data/research/sweep-H4.json -> False"
      - "git log --all -- data/research/sweep-H4.json -> nunca versionado"
      - "config/gts.yaml:186 cita el fichero; README lo cita en 4 lineas"
      - "barrido-AUDUSD-H1-entrenar-2.json: winner = EMA_Trend_Pullback, p_value = 0.998"
      - "El H4 que SI existe es AUDUSD barriendo MA_Crossover, y su confirmacion lo REFUTO (t = -0.488)"
      - "El unico barrido H4 en disco esta VACIO: data/research/archive/walkforward-H4-rules-20261010.json -> results: {candidatos: [], supervivientes: []}"
    por_que_importa: >
      Es la unica regla que gobierna el sistema y su justificacion escrita apunta al
      vacio. Un archivo de arquitectura que cita evidencia inexistente es peor que
      uno que no cita evidencia.
    pruebas_que_lo_fijan: "tests/test_shipped_signal_source.py tiene el test test_the_evidence_timeframe_is_not_the_running_timeframe, pero SALTA porque el fichero no existe (ver ISS-006)."
    fix_propuesto: "Retirar las 5 citas y reescribir la justificacion con lo que SI esta medido (los tres p-valores, todos > 0.05), o generar el fichero. La segunda opcion no cambia el resultado, porque el barrido ya se hizo en H1 y fallo."
    coste: bajo
    reversibilidad: trivial
    siguiente_accion: "R-010"

  - id: ISS-010
    titulo: "El walk-forward no reentrena por fold"
    severidad: alta
    confirma: si
    componente: [VAL-002]
    tipo: defecto_confirmado
    resumen: >
      _walkforward_validate desempaqueta train_idx y nunca lo usa: solo construye
      secuencias de test y predice. El checkpoint se carga UNA vez y se evalua sobre
      la serie entera. El modelo no se adapta a cada fold, que es lo que hace que la
      palabra walk-forward signifique algo.
    evidencia:
      - "research/backtest_v2.py:898 _walkforward_validate: train_idx se desempaqueta y no se usa (aparece en 2 lineas: la del desempaquetado y la del log)"
      - "scripts/walkforward_eval.py:156 el checkpoint se carga una vez"
      - "Medido: 112 de 148 folds caen dentro del tramo de entrenamiento"
    por_que_importa: >
      El bug walk-forward-not-retrained lleva abierto desde 2026-10-03. PARCIAL: lo
      que se hizo fue separar las dos poblaciones en el agregado y declarar
      headline: out_of_sample, no conseguir un walk-forward de verdad. Dejar de
      mezclar dos numeros no es lo mismo que tener un numero valido.
    pruebas_que_lo_fijan: "tests/test_walkforward.py verifica la ETIQUETA, no el reentrenamiento."
    fix_propuesto: "Barato: reportar solo los folds cuyo test empieza despues del corte. Caro: reentrenar por fold. El barato ya esta hecho; el caro es R-003."
    coste: "barato: hecho / caro: alto"
    reversibilidad: "revertir la particion"
    siguiente_accion: "Depende de ISS-002"

