issues:

  # ═════════════════════════ BLOQUEOS DE PRIMERA ═════════════════════════
  - id: ISS-001
    titulo: "El bundle de entrenamiento obsoleto rompe 3 tests de la suite del bot"
    severidad: alta
    confirma: si
    componente: [ML-003, QA-001]
    tipo: defecto_confirmado
    resumen: >
      El bundle gts/ (construido a las 09:31) se extrae a un directorio temporal
      y se coloca PRIMERO en sys.path. Su copia de core/costs.py es anterior a la
      ultima firma y no acepta el parametro `conservative`. Los procesos hijo que
      lanza el barrido paralelo importan esa copia y fallan con
      TypeError: trade_costs() got an unexpected keyword argument 'conservative'.
    evidencia:
      - "Reproduccion minima: pytest tests/test_kaggle_layout.py tests/test_sweep_parallel.py -> 3 FAILED"
      - "Aislado: pytest tests/test_sweep_parallel.py -> 11/11 VERDE"
      - "Suite completa: 1381 pasan, 3 fallan, exit 1"
      - "Traza: .../pt_bot2/test_las_cuatro_velas_del_entr0/working/gts/research/sweep_parallel.py:164"
      - "gts/core/costs.py trade_costs() NO tiene `conservative`; core/costs.py SI lo tiene"
      - "13 ficheros del bundle divergen de la raiz (medido hoy)"
    causa_raiz: >
      tests/test_kaggle_layout.py::_ejecutar_con_rutas_remepeadas extrae el bundle
      a un temporal y lo deja importable. El contamination se propaga a los tests
      posteriores que lanzan procesos hijos (ProcessPoolExecutor en Windows).
    por_que_importa: >
      El fallo NO es del barrido: es del arnes. Pero un arnes que importa el codigo
      equivocado puede hacer que un resultado de barrido sea irreproducible, y un
      numero irreproducible no es evidencia. Ademas deja la suite en rojo, que es la
      unica senal automatica que tiene este sistema.
    pruebas_que_lo_fijan: "tests/test_sweep_parallel.py::{test_el_reparto_devuelve_exactamente_el_mismo_resultado, test_el_orden_es_el_de_entrada_y_no_el_de_finalizacion, test_hay_mas_de_un_proceso_de_verdad}"
    fix_propuesto: "Reconstruir el bundle antes de la suite, o aislar el sys.path del test de Kaggle con monkeypatch.syspath_prepend + restauracion."
    coste: bajo
    reversibilidad: trivial
    estado: RESUELTO
    resuelto_por: >
      ffbe39f: el bundle gts/ se ELIMINO del arbol (era la fuente de la
      contaminacion) y los tests de bundle saltan con motivo cuando no existe.
    verificado: "2026-10-11: suite completa 1379 pasan / 0 fallan / exit 0 con kaggle_layout ANTES de sweep_parallel; corrida adversa del par con exit 0."
    siguiente_accion: "ninguna"

  - id: ISS-002
    titulo: "No existe tramo fuera de muestra: el walk-forward no puede significar lo que dice"
    severidad: CRITICA
    confirma: si
    componente: [VAL-002, ML-002, ECO-001]
    tipo: defecto_confirmado
    resumen: >
      create_data_loaders parte la serie en un prefijo de entrenamiento y un sufijo
      de validacion, y nada mas. El checkpoint best_model.pt es la epoca que minimiza
      la perdida sobre ESE sufijo. El walk-forward etiqueta como out_of_sample los
      folds que caen ahi. Resultado: de 148 folds, 28 son tachados fuera de muestra
      y 8 de esos son la propia validacion que eligio el epoch. El sistema entero
      ha usado su dataset para entrenar y para elegir el checkpoint.
    evidencia:
      - "research/backtest_v2.py:368-371: train_pos=arange(train_size); val_pos=arange(train_size+purge_size, n_seq). No hay un tercer tramo."
      - "El propio fichero lo confiesa: provenance.selection_note = 'el epoch del checkpoint se eligio con validacion que empieza en la fila 45010, dentro de la muestra reportada; por eso los folds llamados out-of-sample no lo son para ese checkpoint'"
      - "scripts/_why_oos_beats_is.py: solo 12 de 148 folds (8.1%) caen en barras que el modelo no vio en ninguna capacidad"
      - "Medido hoy en el fichero: 112 in_sample / 28 out_of_sample; Sharpe OOS -0.064 +- 1.363"
    por_que_importa: >
      Es el bloqueo del dominio 8 y del 18. Mientras no exista un tramo que no entre
      ni en entrenamiento ni en seleccion de epoch, NINGUNA afirmacion sobre si el
      modelo tiene habilidad es respondible. El Sharpe de -0,064 +- 1,363 no
      distingue 'nada' de 'algo': la desviacion (1,36) es 21 veces el valor.
    pruebas_que_lo_fijan: "tests/test_walkforward.py (etiqueta in_sample por fold); tests/test_scaler_fit_scope.py"
    fix_propuesto: "Reservar un tramo final que no se use ni para entrenar ni para elegir epoch. Coste: solo la particion, sin reentrenar. La forma cara (reentrenar por fold) es la que haria que la palabra walk-forward signifique algo."
    coste: medio
    reversibilidad: "revertir la particion"
    siguiente_accion: "R-003. Es la tarea que desbloquea mas dominios."

  - id: ISS-003
    titulo: "El panel puede desactivar los 11 validadores de riesgo sin autenticacion"
    severidad: CRITICA
    confirma: si
    componente: [SEG-003, RISK-001]
    tipo: defecto_confirmado
    resumen: >
      POST /api/features escribe data/control/features.json sin autenticacion ni
      CSRF. Ese fichero se fusiona sobre el YAML en app/config.py, y
      app/features.py::to_risk_limits() lo traduce a los limites que lee
      risk/engine.py. El panel no puede COLOCAR ordenes (correcto, D-015) pero si
      puede APAGAR los frenos que las autorizan.
    evidencia:
      - "dashboard/app/main.py:2118 @app.post('/api/features') -> control().write_features(features, reason=reason)"
      - "El campo `reason` es opcional; solo se pide para features, no para limites"
      - "risk/engine.py lee los limites fusionados"
      - "audit/PHASE1-REPORT.md H4 lo describe como 'la direccion peligrosa'"
    por_que_importa: >
      El encargo del dueno es que la interfaz no adquiera permisos de trading.
      Hoy el panel no envia ordenes, pero puede retirar las condiciones que
      las permiten. El vector es local (127.0.0.1, sin auth), no remoto, asi que
      el riesgo es un proceso local no autorizado, no un atacante de red.
    pruebas_que_lo_fijan: "dashboard/tests/test_features_sin_riesgo.py (4 tests: esquema sin risk, pagina sin interruptores muertos, POST con riesgo descartado y dicho, POST solo-riesgo rechazado con el motivo)."
    fix_propuesto: "Exigir confirmacion explicita y motivo obligatorio para tocar cualquier interruptor de riesgo; alternativamente sacar los interruptores de riesgo del alcance del panel y dejarlos solo en el YAML versionado."
    coste: bajo
    reversibilidad: "revertir el guardián"
    estado: RESUELTO
    resuelto_por: >
      En dos pasos. (1) El bot dejo de escuchar: desde el 2026-10-10 el
      loader descarta los bloques `risk` y `limites` del traspaso del panel,
      con aviso al log (app/config.py). (2) El panel dejo de ofrecer
      (reestructuracion del 2026-10-11): el esquema unico `_FEATURES_SCHEMA`
      no lleva seccion de riesgo, la pagina lo dice con una nota que apunta
      al YAML versionado, y `POST /api/features` descarta `risk`/`limites`
      con respuesta explicita - o los rechaza con 422 si no queda nada que
      escribir. Es la opcion B de R-002, la mas estricta.
    verificado: "2026-10-11: 4/4 tests nuevos del panel; suites completas bot 1383+/0 y panel 418/418 en verde tras el cambio."
    siguiente_accion: "ninguna"

