    tipo: defecto_confirmado
    resumen: >
      MT5 devuelve los timestamps de las barras en HORA DEL SERVIDOR del
      broker (EEST = UTC+3 en MetaQuotes-Demo), codificada como si fuera
      UTC. El detector de barras en formacion del adaptador
      (mt5_feed.py) comparaba esos timestamps contra el reloj LOCAL
      de la maquina (UTC de verdad). Resultado medido: 3 horas de desfase,
      TODA barra de las ultimas 3 horas clasificada como "en formacion"
      aunque llevara cerrada media hora.
    evidencia:
      - "Diagnostico directo: reloj local 22:37 UTC vs broker 01:41 UTC (diferencia 3h04m)"
      - "10 barras M5 del broker: cerrada_hace -8229 a -10929 segundos (negativo = 'en el futuro' segun el reloj local)"
      - "SHADOW anterior funciono porque las barras H1 del viernes estaban tan lejos (46h) que el desfase no las afecto: el bug solo aparece con barras recientes"
    fix_aplicado: >
      `_reloj_del_broker()` en el adaptador usa `terminal.server_time()`
      para el control de barras en formacion. Fallback al reloj local si
      el broker no responde.
    verificado: >
      2026-10-11: 3 tests nuevos (test_reloj_del_broker.py); suite bot
      1463/0/79 exit 0; POLLING EN VIVO contra MT5 real 13/13 exit 0.
    coste: bajo
    reversibilidad: trivial
    estado: RESUELTO
    siguiente_accion: "ninguna"
    detectado_en: "2026-10-11, SHADOW y polling contra MT5 real con el mercado recien abierto"

