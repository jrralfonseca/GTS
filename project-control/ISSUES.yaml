    evidencia:
      - "data/research/archive/walkforward-H1-modelo-medido-20261010.json -> provenance.broker = 'exness'"
      - "Test-Path brokers/exness.yaml -> False"
      - "git ls-files brokers/ -> solo brokers/metaquotes-demo.yaml"
      - "git log --all -- brokers/exness.yaml -> e801d4e, c4ab485 (SI se versiono en su dia)"
