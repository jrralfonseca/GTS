      centavos de siempre. La valla ahora se rompe si el motor cambia su
      aritmetica, que es lo que una valla de conformidad debe.
    verificado: "2026-10-12: tests/test_cost_conformity.py 2/2 verde."
    siguiente_accion: "ninguna"

