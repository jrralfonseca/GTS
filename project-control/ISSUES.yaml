      componente de riesgo sin ninguna valla. La auditoria del 2026-10-09 (H6) lo
      dio por roto al leer context.signal_value, campo que entonces no existia.
      REVISADO HOY: signal_value SI existe ahora en app/decision_core.py:59, asi que
      la premisa original es obsoleta. Lo que NO se ha verificado es si la rama se
