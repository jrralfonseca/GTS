  - id: ISS-046
    titulo: "El bot NO puede emitir alertas: no tiene canales y su manejador no se puede ejecutar"
    severidad: CRITICA
    confirma: si
    componente: [ALR-001, INF-001]
    tipo: defecto_confirmado
    resumen: >
      Dos capas, y basta con que falle una. (1) app/main.py:189 construye el
      RuntimeConfig sin pasar `alerts=`, de modo que el AlertManager de
      runtime/loop.py:635 recibe siempre el AlertsConfig() por defecto, con
      telegram.enabled=False, y registra "No alert channels configured": el
      token del YAML no llega al bot. (2) Los seis manejadores de
      AlertMonitor (scripts/alerts.py:361-383) son SINCRONOS y llaman a
      asyncio.create_task() sobre una corrutina; los invoca el bucle sincrono
      de runtime/loop.py, donde no hay bucle de eventos, asi que la corrutina
      se descarta sin ejecutarse.
    evidencia:
      - "app/main.py:189 -> RuntimeConfig(profile=perfil, policy=RiskPolicy.ENFORCE, allow_funded=allow_funded)"
      - "core/ports/profiles.py::AlertsConfig declara telegram.enabled=False por defecto"
      - "scripts/alerts.py:363,367,371,376,379,383 -> asyncio.create_task(...) desde metodos sync"
      - "PRUEBA, no hipotesis: la suite lo dice en su salida — tests/test_cableado_demo.py::test_demo_con_puerto_si_envia_por_ese_puerto emite 'RuntimeWarning: coroutine AlertManager.alert was never awaited'"
      - "Lo que SI funciona: python -m scripts.alerts --test entrega en el grupo -5504195034"
    por_que_importa: >
      Todo el sistema de alertas de §2.3 del informe es decorativo. Si el bot
      entrara en perdida diaria, perdiera la conexion o le rechazaran una
      orden, no lo dira nadie. La frase "las alertas funcionan" era cierta del
      script suelto y falsa del bot, y era la frase que iba a sostener una
      decision de capital.
    fix_propuesto: >
      (1) Pasar alerts=cfg.alerts en _perfil_de y unificar los dos
      AlertsConfig (ver ISS-047b). (2) Sustituir asyncio.create_task por una
      cola que el bucle drena: el bucle de runtime es sincrono y las alertas
      no pueden dejar de ser asincronas solo porque las emita un codigo
      sincrono. (3) Un test que afirme que el camino esta CABLEADO, no que la
      funcion existe.
    coste: medio
    reversibilidad: trivial
    estado: ABIERTO
    siguiente_accion: "R-017. Es lo primero que se arregla: hasta que las dos capas esten, el resto de la observabilidad mide el servidor de modelo y nada mas."
    detectado_en: "2026-10-14, revision completa del commit bce3e59"

