  - id: ISS-032
    titulo: "La configuracion permite combinaciones cuyo perfil miente sobre la capacidad real de envio"
    severidad: CRITICA
    confirma: si
    componente: [SEG-003, RISK-001, CTL-001]
    tipo: defecto_confirmado
    resumen: >
      Hay DOS interruptores de capacidad que el cargador no valida entre si:
      ``execution.profile`` decide el puerto de ordenes (el camino nuevo), y
      ``execution.live.enabled`` decide el libro (BrokerBook, que envia ordenes
      reales via gateway: el camino viejo), la puerta de evidencia, el
      presupuesto de riesgo y un ``dry_run`` que hoy solo cambia mensajes. El
      resultado: combinaciones aceptadas cuya capacidad real contradice el
      perfil declarado. Es exactamente el pendiente 5 de la seccion 12.
    evidencia:
      - "F1: live.enabled=true construye BrokerBook, cuyo open_position llama backend.open_market (simulation/broker_book.py:626) y close_position a backend.close (:696). La rama 'local' de ProcessBar (core/usecases/process_bar.py:462) llega ahi via PortfolioBook (adapters/portfolio/simulated_book.py:108) con CUALQUIER perfil, incluidos research/paper/shadow cuyos CAPACITIES dicen 'no puede enviar'. El NoSendBroker protege el puerto; el libro es otra via."
      - "F2: profile=demo + live.enabled=false (el config distribuido + UNA linea, y tests/test_cableado_demo.py:161 lo FIJA como cargable) cablea el puerto real (app/main.py:646 solo mira el perfil), se salta la puerta de evidencia (:304 mira is_live), usa el presupuesto simulado del 1% en vez del 0.25% live (:554), opera con libro simulado, y TODOS los mensajes dicen 'DRY RUN - simulated book, no orders' (:690) y 'in DRY RUN and sends no orders' (runtime/loop.py:581)"
      - "F3: --dry-run solo cambia el flag de mensajeria (app/main.py:903-909); ProcessBar decide el envio con puede_enviar y puerto, sin consultar dry_run (process_bar.py:433), y el libro tampoco. El docstring de cmd_run promete 'simulate and send nothing' y test_launch_command.py:403 documenta 'forces the simulated book': hoy es cosmetico en configs live"
      - "F4: la puerta de evidencia (:304) comprueba is_live pero su mensaje dice 'perfil con permiso de envio' - el predicado y el texto derivaron"
    por_que_importa: >
      La especificacion (seccion 6) exige capacidades inequivocas por perfil y
      barreras que protejan el camino de ejecucion efectivo; la 3.3 prohibe
      habilitar envios por descuido. Hoy el arbol esta a UNA linea de un bot
      que enviaria ordenes reales a la cuenta demo con todos los indicadores
      diciendo 'DRY RUN', y cualquier perfil 'sin envio' combina con un libro
      que si envia. Lo unico que hoy frena las combinaciones enabled=true es la
      puerta de evidencia, que es dependiente de datos: se abrira el dia que
      un experimento aguante.
    fix_aplicado: >
      Coherencia obligatoria en el LOADER (app/config.py, un solo sitio): un
      perfil con capacidad de envio (demo/live) exige live.enabled=true, y
      live.enabled=true exige un perfil con capacidad (_PERFILES_CON_ENVIO).
      Con eso una sola prediceta gobierna libro, puerta, presupuesto y
      puerto, y el mensaje de la puerta (:311) vuelve a ser verdad. --dry-run
      sobre un config live se niega a arrancar en run Y once con un mensaje
      que apunta al interruptor real (la linea versionada del fichero), y el
