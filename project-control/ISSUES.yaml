    pruebas_que_lo_fijan: "tests/test_result_provenance.py verifica que el bloque existe y viaja; no verifica que el broker declarado exista en disco."
    fix_propuesto: "Restaurar brokers/exness.yaml desde HEAD, o re-emitir los resultados con el perfil que si existe. Decidir cual de los dos perfiles es el canonico (ver R-004)."
    coste: trivial
    reversibilidad: trivial
    siguiente_accion: "R-004"

