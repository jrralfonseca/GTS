# ═══════════════════════════════════════════════════════════════════════════
# Lo que NO esta en el roadmap, y por que
# ═══════════════════════════════════════════════════════════════════════════
fuera_de_alcance:
  - que: "Reentrenar el modelo por fold (walk-forward de verdad)"
    por_que: "Es la forma CARA de R-003. El cambio barato (la particion) esta primero. Reentrenar sin un tramo reservado seria medir sobre una muestra que ya se uso para elegir."
    cuando: "despues de R-003, si el tramo reservado da una respuesta"
  - que: "Anadir mas estrategias al catalogo"
    por_que: "El catalogo se podo de 18 a 11 el 2026-10-08 con una valla de una voz por pregunta. Anadir seria ir en contra de la decision mas reciente y deliberada."
  - que: "Conectar la ejecucion real"
    por_que: "Requiere resolver R-002, tener evidencia confirmada, y una decision explicita del dueno. Ninguna de las tres existe hoy."
  - que: "Optimizar el ATR que se recalcula en cada barra"
    por_que: "Medido: 1,171 ms por barra frente a 9,1 ms una vez para 50 000 barras. En operacion es 1,2 ms por H1. Es el 28 % del tiempo de un replay, no un orden de magnitud. Arreglarlo toca el bucle de verdad."
  - que: "Arreglar el filtro de niveles de los logs del bot"
    por_que: "Ya resuelto con honestidad: los logs del bot traen un aviso que explica por que no tienen filtro. Un filtro que parece funcionar y no filtra seria PEOR. Documentado en ISS-024 para que nadie lo 'arregle'."
  - que: "Deflated Sharpe Ratio"
    por_que: "Decision ya tomada y documentada: daria un segundo numero, mas favorable, al lado del conservador de White. El riesgo es que se cite el favorable."
  - que: "Mas Parallelizacion del barrido"
    por_que: "El reparto ya existe y su paridad se exige bit a bit. La limitacion actual es el bundle, no la velocidad (R-001)."