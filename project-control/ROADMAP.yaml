    componentes: [BT-002, ACC-001, COST-001]
    depende_de: []
    bloquea_a: []
    criterios_aceptacion:
      - "_neto_backtest_usd() obtiene su bruto de PurgedWalkForwardBacktest, no de una cuenta manual"
      - "El test falla si alguien cambia el spread del modulo y no actualiza el test"
    pruebas: ["tests/test_cost_conformity.py reescrito"]
    evidencia_esperada: "El mismo test, con dos motores ejercidos de verdad"
    coste: "bajo"
    riesgo: "nulo"
    estado: COMPLETADO
    completado: "2026-10-12"
    evidencia: >
      _neto_backtest_usd() conduce PurgedWalkForwardBacktest._compute_pnl con
      un fold de 49 barras y EXACTAMENTE una senal (lunes 00:00 long, label
