      El costeo unificado es el cambio mas grande de las ultimas dos semanas. La
      valla que lo sostiene calcula el bruto A MANO y llama a trade_costs; nunca
      construye el motor del backtest. La garantia de que backtest y simulacion
      cobran lo mismo no esta probada por ninguna parte.
