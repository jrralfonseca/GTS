      - "La justificacion de la regla por defecto dice lo que esta MEDIDO: tres p-valores, todos > 0.05"
      - "Los huecos de validez del README reflejan el estado del codigo"
      - "El docstring del grafo de dependencias dice lo que el grafo es"
    pruebas: ["test que falle si alguien cita un fichero inexistente en config/"]
    evidencia_esperada: "SYSTEM_MAP.md y README sincronizados; COMPONENTS.yaml sin discrepancias"
    coste: "bajo"
    riesgo: "nulo: es documentacion, no logica"
    decision_relacionada: >
      La regla por defecto es EMA_Trend_Pullback y su unico barrido da p = 0.998.
      Corregir la cita NO cambia el resultado. Puede que la decision de seguir
      operandola como default sea del dueno y deba quedar escrita como tal, con su
      razon. Eso es R-010.
    estado: COMPLETADO
    completado: "2026-10-12"
    evidencia: >
      Las 5 citas a sweep-H4.json retiradas de config y README; la
      justificacion de la regla embarcada dice ahora la verdad COMPLETA (es
      la regla de referencia del camino de reglas; el unico barrido en disco
      no sostiene nada, 0/5 p=0.9935; el registro no confirma ninguna regla
      ninguna). Valla de citas nueva: TODA ruta data/research/*.json citada
      en config o README existe en disco, y el conteo minimo es parte de la
      asercion. Los huecos de validez del README quedaron sincronizados
      (costes: cerrado; correccion del barrido: cerrada para el barrido).
      El docstring del grafo describe el arbol real (el ciclo app<->runtime
      murio con la extraccion de decisions/; ISS-021 resuelta). Falta solo
      el resto de ISS-019 (justificacion del stack web, una linea de
      documentacion en SYSTEM_MAP): menor y sin riesgo.

  - id: R-010
    prioridad: 10
    titulo: "Decidir que hace el sistema con una regla sin evidencia"
    justificacion: >
      El sistema tiene un mecanismo de seguridad que funciona: el bot se niega a
      arrancar sin evidencia confirmada. Pero config/gts.yaml declara igualmente
