    verificado: "2026-10-12"
    evidencia: >
      Verificado antes de arreglar, como pedia la nota, y la respuesta
      cambia la tarea: el optimizador ES un instrumento completo (guarda el
      import con negativa ruidosa, codependence SI se lee y llega a
