      Cinco guardianes se saltan con 'no sweep result on disk', pero los barridos
      YA ESTAN en disco con n_trials=25 y el bloque reality_check completo. El unico
      test que ejecuta el Reality Check de punta a punta no corre nunca. Un skip que
      nadie mira es peor que un fallo: el unico sintoma es que el guardiano no esta.
    resuelve: [ISS-006, ISS-009]
    componentes: [QA-001, RES-003, RES-002, ECO-001]
    depende_de: [R-001]
    bloquea_a: []
    criterios_aceptacion:
      - "Ningun test se salta por falta de un fichero que existe"
      - "Si el fichero no existe, el test FALLA con un mensaje que dice que falta"
      - "El numero de skips baja de 10 a los que sean justificables"
    pruebas:
      - "Los 5 skips convertidos en fallos anunciados"
      - "test_shipped_signal_source.py deja de depender de sweep-H4.json, que no existe"
    evidencia_esperada: "EVIDENCE.yaml -> suites[bot].skipped con el recuento nuevo y el motivo de cada uno"
    coste: "bajo"
    riesgo: "nulo"
    estado: COMPLETADO
    completado: "2026-10-12"
    evidencia: >
      Los 5 guardianes corren contra artefactos reales y fallan si falta lo
      que vigilan: reality_check apunta al barrido real (y la leccion mejora:
      el mejor |t| del fichero, 8.29, es el de una configuracion de 3
      trades); sweep_universe exige n_trials presente E igual al recuento de
      filas, y el guardian de la serie mira barrido-*.json y sweep-*.json
      fallando si no hay nada que vigilar; shipped_signal_source cambia sus
      dos tests de premisa muerta por la valla de citas y el estado honesto
      del registro. Se encontraron ADEMAS 6 guardianes de mecanica del
      corte que saltaban con motivo falso ("no bars CSV" con tres CSV en el
      directorio) por estar cableados a un XAUUSD_H1.csv de otra era:
      revivieron con un CSV existente y la identidad de su cabecera.
      Recuento: 54 saltos con motivo frente a 79, todos declarando el
      suyo. Ver ISS-006.

