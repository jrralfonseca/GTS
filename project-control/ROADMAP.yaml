  - id: R-009
    prioridad: 9
    titulo: "Corregir las afirmaciones del sistema que no se sostienen"
    justificacion: >
      config/gts.yaml justifica la regla por defecto con un fichero que no existe
      (citado en 5 sitios). El README declara abiertos dos huecos que el codigo ya
