    titulo: "Que la suite del bot vuelva a estar en verde"
    justificacion: >
      1381/1384 pasan. Los 3 fallos tienen una sola causa: un bundle de
      entrenamiento obsoleto que se inyecta en sys.path. No es un defecto del
      barrido, es del arnes — pero un arnes que importa el codigo equivocado puede
      hacer que un resultado sea irreproducible, y un numero irreproducible no es
      evidencia. Ademas deja la unica senal automatica del sistema en rojo.
    resuelve: [ISS-001, ISS-026, ISS-027]
    componentes: [ML-003, QA-001, RES-002]
    depende_de: []
    bloquea_a: [R-002, R-006, R-008]
    tareas:
      - "Decidir si se regenera el bundle antes de la suite, o se aísla el sys.path del test de Kaggle con restauracion"
      - "Verificar que gts/ se reconstruye o se ignora de forma explicita en el orden de tests"
    criterios_aceptacion:
      - "pytest tests -> exit 0"
      - "pytest tests\\test_kaggle_layout.py tests\\test_sweep_parallel.py -> exit 0 (orden adverso)"
      - "La paridad paralelo/serie queda verificada en la suite completa, no solo aislada"
    pruebas: ["tests/test_sweep_parallel.py (los 3 que fallan)"]
    evidencia_esperada: "EVIDENCE.yaml -> suites[bot] con passed=1384, failed=0, exit_code=0"
    coste: "bajo"
    riesgo: "nulo: no toca logica de trading"
    tiempo_para_desbloquear_la_siguiente: "inmediato"
    estado: COMPLETADO
    completado: "2026-10-11"
    evidencia: >
      Suite completa: 1458 coleccionados, 1379 pasan, 0 fallan, 79 saltan con
      motivo, exit 0, 640 s. Orden adverso (kaggle_layout antes de
      sweep_parallel): exit 0. La causa de los 3 fallos murio con el bundle
      eliminado (gts/ ya no existe; sus tests saltan con motivo). Detalle y
      leccion del incidente de la cache de numba en EVIDENCE.yaml suites[bot].

  - id: R-002
    prioridad: 2
    titulo: "Decidir si el panel puede desarmar los validadores de riesgo"
    justificacion: >
      POST /api/features escribe el fichero que traduce a los limites que lee el
      motor de riesgo, sin autenticacion ni CSRF. El panel no coloca ordenes —que es
      lo que el encargo protege y el sistema respeta con valla— pero puede apagar
      los once frenos que las autorizan. Es el unico hallazgo de seguridad abierto.
    resuelve: [ISS-003]
    componentes: [SEG-003, RISK-001]
    depende_de: []
    bloquea_a: []
    requiere_decision_del_propietario: true
    opciones:
      - "A: Exigir motivo obligatorio + confirmacion explicita para cualquier interruptor de riesgo, y journalizarlo"
      - "B: Sacar los interruptores de riesgo del panel; solo en el YAML versionado"
    criterio_de_esquema: >
      El encargo dice que la interfaz no debe adquirir permisos de trading. B es la
      lectura literal; A es la pragmatica. Es una decision del propietario.
    criterios_aceptacion:
      - "Existe un test que exige autorizacion en POST /api/features"
      - "Ningun cliente HTTP local puede desactivar un validador sin una accion deliberada y trazable"
    pruebas: ["dashboard/tests/test_features_sin_riesgo.py (nuevos, 4/4)"]
    evidencia_esperada: "EVIDENCE.yaml -> seguridad: la comprobacion pasa de NO_CUMPLE a CUMPLE con su metodo"
    coste: "bajo"
    riesgo: "bajo, reversible"
    estado: RESUELTO
    resuelto: >
      2026-10-11, por la via B (la mas estricta): el bot descarta risk/limites
      del traspaso desde el 2026-10-10, y la reestructuracion del panel dejo
      de ofrecer la seccion, dice donde vive el riesgo (el YAML versionado) y
      rechaza o descarta los POST que intenten colarlo, con respuesta
      explicita. Ver ISS-003 para el detalle y la verificacion.

  - id: R-003
    prioridad: 3
    titulo: "Reservar un tramo que no entre ni en entrenamiento ni en elegir epoch"
    justificacion: >
      Es EL bloqueo del sistema. De 148 folds, 28 se tachan fuera de muestra y 8 de
      esos son la validacion que eligio el checkpoint. Solo 12 de 148 (8.1%) caen
      en barras que el modelo no vio en ninguna capacidad. Mientras no exista ese
      tramo, ninguna afirmacion sobre si el modelo tiene habilidad es respondible:
      el Sharpe OOS de -0,064 +- 1,363 tiene 21 veces mas dispersion que valor.
    resuelve: [ISS-002, ISS-010]
    componentes: [VAL-002, ML-002, ECO-001, BT-001]
    depende_de: [R-001]
    bloquea_a: [R-010, R-011, R-012]
    requiere_aprobacion_explicita: "Es un cambio de la particion de datos: cambia que cifras existen."
    alcance_minimo:
      - "Partir la serie en tres: train / validacion-de-epoch / HELD-OUT-FINAL"
      - "El HELD-OUT no entra en ninguna funcion que ajuste nada"
      - "Cada fold declara su posicion respecto a los tres cortes, no a uno"
    fuera_de_alcance:
      - "Reentrenar por fold (caro; es R-013, no esto)"
    criterios_aceptacion:
      - "Existe al menos un fold cuyo test empieza despues del FIN de la validacion"
      - "El agregado declara cuantos hay de cada tipo, con su N"
      - "Un test que falle si el held-out aparece en alguna funcion de ajuste"
    pruebas:
      - "test que verifique que el held-out no se usa en train_pos, val_pos ni en la seleccion de epoch"
      - "test que cuente los folds por categoria y exija >= 1 fuera de muestra estricto"
    evidencia_esperada: >
      Un walk-forward nuevo con: n_folds, n_in_sample, n_out_of_sample ESTRICTO, su
      Sharpe con su desviacion, y su procedencia completa. Un Sharpe de -0,064 +- 1,363
      no es un hallazgo; un Sharpe con N sufficient y su dispersion, si.
    coste: "medio (la particion; sin reentrenar)"
    riesgo: "bajo, reversible revirtiendo la particion"

  - id: R-004
    prioridad: 4
    titulo: "Que el perfil de broker que produjo la evidencia exista en el arbol"
    justificacion: >
      Los resultados del 2026-10-10 declaran broker: exness en su procedencia. Ese
      YAML esta borrado del arbol de trabajo. El sistema gasto dos commits
      persiguiendo la trazabilidad completa, y esa garantia queda anulada si el
      fichero que el resultado declara no esta.
    resuelve: [ISS-004]
    componentes: [OPS-003, RES-002, VAL-002]
    depende_de: []
    bloquea_a: []
    requiere_decision_del_propietario: true
    opciones:
      - "A: Restaurar brokers/exness.yaml desde HEAD y decidir cual es el perfil canonico"
      - "B: Re-emitir los resultados con brokers/metaquotes-demo.yaml, que si esta"
    criterios_aceptacion:
      - "El broker declarado en cada resultado de data/research/ existe en brokers/"
      - "Un test que verifique esa correspondencia"
    pruebas: ["nuevo test: el broker de cada procedencia apunta a un fichero existente"]
    evidencia_esperada: "Los mismos resultados, con un broker que se puede abrir."
    coste: "trivial"
    riesgo: "nulo"
    aviso: "OBSOLETO: las 220 eliminaciones preparadas ya no existen (resueltas en commits) y brokers/exness.yaml esta restaurado y versionado."
    estado: RESUELTO
    resuelto: "2026-10-11: brokers/exness.yaml verificado en git ls-files y en disco; los walkforwards que lo citaban fueron retirados por la limpieza de la nueva etapa."

  - id: R-005
    prioridad: 5
    titulo: "Decidir donde vive la evidencia"
    justificacion: >
      data/ esta en .gitignore. Ni data/raw/ ni data/research/ tienen backup
      declarado. El sistema sabe declarar la procedencia de un resultado, pero el
      soporte fisico de esa evidencia no esta en ningun sitio versionado.
    resuelve: [ISS-016]
    componentes: [OPS-003]
    depende_de: []
    bloquea_a: []
    requiere_decision_del_propietario: true
    es_una_decision: "de coste y de riesgo, no tecnica"
    criterios_aceptacion:
