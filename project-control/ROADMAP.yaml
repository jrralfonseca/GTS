# GTS — Roadmap por dependencias
# Revision: ffbe39f · Fecha: 2026-10-11
#
# CRITERIO DE ORDEN (del encargo, y el que manda):
#   No se prioriza velocidad ni funcionalidad nueva por encima de correccion,
#   control de riesgo o validez de las pruebas.
#
# POR QUE ESTE ORDEN Y NO OTRO:
#   El sistema esta parado por su propia regla — cero evidencia confirmada, el bot
#   se niega a arrancar. No es un fallo: es la puerta funcionando. Lo que falta no
#   es velocidad, es que la evidencia que YA HAY en disco llegue a las vallas, y que
#   las tres afirmaciones del sistema que no se sostienen se corrijan.
#
#   Las tareas baratas van primero porque/desbloquean la MEDICION de las caras. Un
#   test rojo que se corrige con una linea (R-001) es lo que hace R-002 medible.

meta:
  fecha: "2026-10-12"
  commit: "tras 9efed97 (etapa estructural)"
  regla_de_orden: "correccion > control de riesgo > validez de pruebas > trazabilidad > velocidad > funcionalidad"
  ninguna_tarea_arranca_sin_aprobacion: true
  estado_del_sistema: >
    PARADO POR DISENO: sin evidencia confirmada el bot sigue negandose a
    arrancar. AMBAS suites en VERDE y certificadas (2026-10-12, etapa
    estructural): bot 1648 coleccionados / 1594 pasan / 54 saltos con
    motivo / exit 0; panel 500/500 / exit 0. La puerta es
    scripts/suite_completa.py. Ninguna metodologia aprobada; el registro
    no confirma ninguna regla; el bloque limpio de EURUSD H1 2010-2018
    (Fase 1) espera a la Fase 2 del plan de cualificacion.

